# A Kubernetes Secret is base64, not encryption. Anyone who can read Secrets in this
# namespace can read these values, so the namespace needs RBAC accordingly.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_at_least_32_bytes_of_random_secret"
  CATALOG_MONGO_USERNAME: "catalog"
  CATALOG_MONGO_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  AUTH_POSTGRES_DB: "authdb"
  AUTH_POSTGRES_USER: "auth"
  AUTH_POSTGRES_PASSWORD: "REPLACE_ME"
  ORDER_POSTGRES_DB: "orderdb"
  ORDER_POSTGRES_USER: "orders"
  ORDER_POSTGRES_PASSWORD: "REPLACE_ME"
