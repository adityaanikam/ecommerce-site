# Alerting rules.
#
# Every rule here fires on a metric that the stack actually produces. The previous
# version alerted on redis_up and mongodb_up, which come from dedicated exporters
# that are not deployed, and on hikaricp metrics from a service that had no SQL
# database at all. Those have been replaced with the equivalents that exist.

groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not being scraped"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes."

      - alert: ServiceNotReady
        # Spring Boot's readiness state, surfaced through the health group. A
        # service that is up but not ready is usually waiting on a dependency.
        expr: up == 1 and on(instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.5)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is serving errors steadily"
          description: "{{ $labels.instance }} has been returning 5xx responses for 5 minutes."

  - name: application
    rules:
      - alert: HighErrorRate
        expr: >
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} error rate above 5%"
          description: "More than 5% of requests to {{ $labels.job }} have failed for 5 minutes."

      - alert: HighResponseTime
        expr: >
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 latency above 2s"
          description: "The 95th percentile response time for {{ $labels.job }} has been over 2 seconds for 5 minutes."

      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} CPU above 80%"
          description: "{{ $labels.instance }} has been above 80% CPU for 5 minutes."

      - alert: HighMemoryUsage
        expr: >
          sum by (job, instance) (jvm_memory_used_bytes{area="heap"})
          / sum by (job, instance) (jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} heap above 85%"
          description: "{{ $labels.instance }} has been above 85% heap for 5 minutes."

  - name: database
    rules:
      - alert: ConnectionPoolSaturated
        # Only auth-service and order-service have a SQL pool. catalog-service uses
        # MongoDB and produces no hikaricp metrics, so this is scoped by job rather
        # than applied to everything.
        expr: >
          hikaricp_connections_active{job=~"auth-service|order-service"}
          / hikaricp_connections_max{job=~"auth-service|order-service"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} connection pool above 80%"
          description: "{{ $labels.instance }} has been using more than 80% of its database connections for 5 minutes."

  - name: integration
    rules:
      - alert: OutboxBacklogGrowing
        # The failure this design can hide. Orders keep succeeding while events stop
        # being published, so stock silently stops being decremented and nothing
        # looks broken until someone counts the warehouse.
        expr: order_outbox_pending_events > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The order outbox is not draining"
          description: "{{ $value }} OrderPlaced events have been waiting to publish for 5 minutes. Check the broker and the publisher."

      - alert: CatalogCircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{name="catalog", state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "order-service has given up on catalog-service"
          description: "The circuit breaker around catalog-service is open, so no orders can be priced or placed."

      - alert: KafkaConsumerLagging
        expr: kafka_consumer_fetch_manager_records_lag_max > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A Kafka consumer is falling behind"
          description: "{{ $labels.job }} is more than 1000 records behind on {{ $labels.topic }}."
