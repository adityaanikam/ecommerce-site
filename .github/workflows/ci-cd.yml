name: CI

# Runs on the microservices branch and on main, and on pull requests into either.
# The previous file was two workflows concatenated into one, so `on:` and `jobs:`
# each appeared twice at the top level. GitHub rejects duplicate keys, which is why
# every run failed in 0 seconds without executing a single step.
on:
  push:
    branches: [ main, microservices ]
  pull_request:
    branches: [ main, microservices ]
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # One failing service should not hide the state of the other three.
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-service
          - auth-service
          - order-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        # verify, not test: the integration tests are bound to failsafe, and those
        # are the ones that prove the idempotency key, the outbox and the circuit
        # breaker actually work. They use Testcontainers, which needs a Docker
        # daemon; ubuntu-latest runners have one.
        env:
          # Only the gateway and auth-service read this, but setting it for every
          # service in the matrix keeps the step identical across them.
          JWT_SECRET: ci-only-secret-value-at-least-32-bytes-long
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-images:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: services
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-service
          - auth-service
          - order-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built but not pushed. There is no registry configured for this project, and
      # the point here is to prove the multi-stage Dockerfile still builds, which a
      # push would not add anything to.
      - name: Build the ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: ecommerce/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

      # The existing vitest suite is NOT run here. It fails for reasons that predate
      # this work (a test that renders a Router inside a Router, and an assertion
      # that a button is disabled when it is not), and those test components were
      # explicitly out of scope. Gating on them would mean a permanently red build
      # that nobody looks at. docs/STATUS.md records this rather than hiding it.

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a broken compose file without starting the stack. Every password is
      # a required variable with no default, so values have to be supplied here;
      # they are throwaway and never reach a real service.
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid"

      - name: Check no real secrets are committed
        run: |
          # .github is excluded because this very step contains the patterns it
          # searches for, and would otherwise always match itself.
          if grep -rnE "password123|redis123|mySecretKey[0-9]" \
              --include='*.yml' --include='*.yaml' --include='*.properties' \
              --exclude-dir=node_modules --exclude-dir=target \
              --exclude-dir=.github .; then
            echo "A known placeholder secret is still committed."
            exit 1
          fi
          echo "No known placeholder secrets found"
