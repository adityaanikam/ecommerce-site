# Local stack for the microservices split.
#
# Every password and secret comes from .env, which is git-ignored. See .env.example.
# Nothing in this file has a baked-in credential: a missing variable makes compose
# fail loudly rather than silently starting with a known-weak default, which is what
# the previous version of this file did with password123 / redis123 and a JWT secret
# committed in plain text.

name: ecommerce

services:
  # ------------------------------------------------------------- catalog database
  catalog-mongo:
    image: mongo:7.0
    container_name: ecommerce-catalog-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CATALOG_MONGO_USERNAME:?set CATALOG_MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_MONGO_PASSWORD:?set CATALOG_MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: catalog
    ports:
      - "27017:27017"
    volumes:
      - catalog_mongo_data:/data/db
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------- catalog cache
  redis:
    image: redis:7.2-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------- Kafka
  # Single node in KRaft mode: the broker is its own controller, so there is no
  # ZooKeeper to run. One node means one replica, which is fine for local work and
  # is called out as a deliberate limitation in docs/ARCHITECTURE.md.
  kafka:
    image: apache/kafka:3.8.0
    container_name: ecommerce-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      # 29092 is the listener advertised as localhost, for tools run on the host.
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ------------------------------------------------------------- catalog service
  catalog-service:
    build:
      context: ./services/catalog-service
    container_name: ecommerce-catalog-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      CATALOG_MONGODB_URI: mongodb://${CATALOG_MONGO_USERNAME}:${CATALOG_MONGO_PASSWORD}@catalog-mongo:27017/catalog?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CATALOG_IMAGES_BASE_PATH: /app/Products
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      # Mounted rather than baked into the image so the image stays small and the
      # same build can point at object storage in a real deployment.
      - ./backend/Products:/app/Products:ro
    ports:
      - "8081:8081"
    depends_on:
      catalog-mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ----------------------------------------------------------------- the front door
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CATALOG_SERVICE_URL: http://catalog-service:8081
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:?set GATEWAY_ALLOWED_ORIGINS in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8080:8080"
    depends_on:
      catalog-service:
        condition: service_healthy
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  catalog_mongo_data:
  redis_data:
  kafka_data:

networks:
  ecommerce:
    driver: bridge
